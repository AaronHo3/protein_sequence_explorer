[project]
name = "protein-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "pandas>=2.2"]

[project.optional-dependencies]
app = ["plotly>=5.24", "scipy>=1.11", "streamlit>=1.51"]
dev = ["biopython>=1.84", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
